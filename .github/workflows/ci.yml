name: CI

# Single job, two gates:
#   - tests + coverage summary are the HARD gate (fail the job / block).
#   - new-code coverage reuses the same run's report (--no-run) as a NON-BLOCKING
#     gate (`continue-on-error`): it shows the result but never blocks — a
#     committer can force-merge. Coverage is a signal, not a hard requirement.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed to diff against the base

      - name: Install Neovim
        uses: MunifTanjim/setup-neovim-action@v1
        with:
          tag: stable

      - name: Install clangd (integration tests)
        run: sudo apt-get update && sudo apt-get install -y clangd

      - name: Run tests + coverage summary (hard gate)
        run: nvim --headless -u NONE -l tests/run_coverage.lua

      - name: New-code coverage (pull request, non-blocking)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: nvim --headless -u NONE -l tests/run_coverage.lua --diff origin/${{ github.event.pull_request.base.ref }} --no-run

      - name: New-code coverage (push, non-blocking)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: nvim --headless -u NONE -l tests/run_coverage.lua --diff HEAD~1 --no-run

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: luacov-report
          path: luacov.report.out
